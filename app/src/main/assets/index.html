<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body, #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e1e;
            touch-action: none;
            -webkit-user-select: text !important;
            user-select: text !important;
        }
    </style>
</head>
<body>
<div id="container"></div>

<script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.log("JS ERROR: " + msg + " at " + url + ":" + lineNo);
        return false;
    };

    let pendingCode = null;
    let pendingExtension = "";

    function getLanguageByExtension(ext) {
        switch ((ext || '').toLowerCase()) {
            case 'java': return 'java';
            case 'kt': case 'kts': return 'kotlin';
            case 'js': return 'javascript';
            case 'ts': return 'typescript';
            case 'html': case 'htm': return 'html';
            case 'css': return 'css';
            case 'json': return 'json';
            case 'xml': return 'xml';
            case 'c': case 'cpp': case 'cxx': case 'cc': case 'h': case 'hpp': return 'cpp';
            case 'cs': return 'csharp';
            case 'py': return 'python';
            case 'php': return 'php';
            case 'sh': case 'bash': return 'shell';
            case 'md': return 'markdown';
            case 'sql': return 'sql';
            case 'yaml': case 'yml': return 'yaml';
            default: return 'plaintext';
        }
    }

    function initMonacoEditor() {
        console.log("Initializing Monaco editor instance...");
        const initialLang = pendingExtension ? getLanguageByExtension(pendingExtension) : 'java';
        const initialVal = pendingCode !== null ? pendingCode : "// Welcome to Code Editor!\n// Open a file to start editing.";

        window.editor = monaco.editor.create(document.getElementById('container'), {
            value: initialVal,
            language: initialLang,
            theme: 'vs-dark',
            automaticLayout: true,
            minimap: { enabled: false },
            fontSize: 14,
            scrollBeyondLastLine: false,
            wordWrap: 'on',
            readOnly: false,
            domReadOnly: false,
            autoClosingBrackets: 'always',
            autoClosingQuotes: 'always',
            selectOnLineNumbers: true,
            selectionHighlight: true,
            dragAndDrop: true,
            mouseWheelZoom: true,
            smoothScrolling: true,
            multiCursorModifier: 'ctrlCmd',
            quickSuggestions: {
                other: true,
                comments: true,
                strings: true
            },
            suggestOnTriggerCharacters: true,
            wordBasedSuggestions: 'currentDocument',
            suggest: {
                minWordLength: 1,
                showWords: true,
                showKeywords: true,
                showSnippets: true,
                showVariables: true,
                showFunctions: true,
                showClasses: true,
                showStructs: true,
                localityBonus: true,
                shareSuggestSelections: true
            }
        });

        pendingCode = null;

        if (window.AndroidBridge) {
            console.log("Calling AndroidBridge.onEditorReady()...");
            window.AndroidBridge.onEditorReady();
        }

        // Debounced text sync: prevents UI thread bottlenecks during rapid hardware keyboard typing/backspace
        let textChangeTimeout = null;
        window.editor.onDidChangeModelContent(() => {
            if (textChangeTimeout) {
                clearTimeout(textChangeTimeout);
            }
            textChangeTimeout = setTimeout(() => {
                if (window.AndroidBridge) {
                    window.AndroidBridge.onTextChanged(window.editor.getValue());
                }
            }, 300);
        });

        // Pointer/Mouse selection engine for Android WebView
        let isMouseDown = false;
        let startPos = null;
        let lastClickTime = 0;
        let clickCount = 0;

        const containerEl = document.getElementById('container');

        // Prevent Android WebView's native SelectionPopupController from overriding DOM selection
        containerEl.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });

        containerEl.addEventListener('pointerdown', function(e) {
            if (e.button === 0 || e.pointerType === 'mouse' || e.pointerType === 'pen' || e.pointerType === 'touch') {
                isMouseDown = true;
                const currentTime = Date.now();
                const timeDiff = currentTime - lastClickTime;

                if (timeDiff < 350) {
                    clickCount++;
                } else {
                    clickCount = 1;
                }
                lastClickTime = currentTime;

                if (window.editor) {
                    const target = window.editor.getTargetAtClientPoint(e.clientX, e.clientY);
                    if (target && target.position) {
                        const targetPos = target.position;

                        if (clickCount === 2) {
                            // DOUBLE-CLICK: Select word with multi-phase enforcement
                            const selectWord = () => {
                                const model = window.editor.getModel();
                                if (model) {
                                    const word = model.getWordAtPosition(targetPos);
                                    if (word) {
                                        const wordRange = new monaco.Range(
                                            targetPos.lineNumber,
                                            word.startColumn,
                                            targetPos.lineNumber,
                                            word.endColumn
                                        );
                                        window.editor.setSelection(wordRange);
                                        window.editor.focus();
                                    }
                                }
                            };
                            selectWord();
                            setTimeout(selectWord, 50);
                            setTimeout(selectWord, 150);
                        } else if (clickCount >= 3) {
                            // TRIPLE-CLICK: Select line with multi-phase enforcement
                            const selectLine = () => {
                                const model = window.editor.getModel();
                                if (model) {
                                    const maxCol = model.getLineMaxColumn(targetPos.lineNumber);
                                    const lineRange = new monaco.Range(
                                        targetPos.lineNumber,
                                        1,
                                        targetPos.lineNumber,
                                        maxCol
                                    );
                                    window.editor.setSelection(lineRange);
                                    window.editor.focus();
                                }
                            };
                            selectLine();
                            setTimeout(selectLine, 50);
                            setTimeout(selectLine, 150);
                            clickCount = 0;
                        } else {
                            // SINGLE-CLICK: Set cursor & drag start
                            startPos = targetPos;
                            window.editor.setPosition(startPos);
                            window.editor.focus();
                        }
                    }
                }
            }
        });

        containerEl.addEventListener('pointermove', function(e) {
            if (isMouseDown && window.editor && startPos && clickCount <= 1) {
                const target = window.editor.getTargetAtClientPoint(e.clientX, e.clientY);
                if (target && target.position) {
                    window.editor.setSelection(monaco.Range.fromPositions(startPos, target.position));
                }
            }
        });

        document.addEventListener('pointerup', function(e) {
            isMouseDown = false;
        });

        window.addEventListener('resize', function() {
            if (window.editor) {
                window.editor.layout();
            }
        });
        setTimeout(function() {
            if (window.editor) {
                window.editor.layout();
            }
        }, 300);
    }

    // Hybrid Loader: loads online CDN when connected, or falls back to local assets
    function loadMonaco(useCDN) {
        const vsPath = useCDN
            ? 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'
            : 'monaco/min/vs';

        if (!useCDN) {
            window.MonacoEnvironment = {
                getWorkerUrl: function () {
                    return 'data:text/javascript;charset=utf-8,';
                }
            };
        }

        const loaderScript = document.createElement('script');
        loaderScript.src = vsPath + '/loader.js';
        loaderScript.onerror = function() {
            if (useCDN) {
                console.log("CDN failed, falling back to local Monaco...");
                loadMonaco(false);
            }
        };
        loaderScript.onload = function() {
            require.config({ paths: { 'vs': vsPath }});
            require(['vs/editor/editor.main'], function() {
                initMonacoEditor();
            });
        };
        document.head.appendChild(loaderScript);
    }

    // Try online CDN first, fallback to local assets offline
    if (navigator.onLine) {
        loadMonaco(true);
    } else {
        loadMonaco(false);
    }

    function base64ToUtf8(base64) {
        try {
            const binString = atob(base64);
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        } catch (e) {
            console.error("Failed to decode base64:", e);
            return "";
        }
    }

    function setEditorValueFromAndroid(base64Code, extension) {
        const decoded = base64ToUtf8(base64Code);
        if (window.editor) {
            if (window.editor.getValue() !== decoded) {
                const currentSelection = window.editor.getSelection();
                const currentScrollTop = window.editor.getScrollTop();
                window.editor.setValue(decoded);
                if (currentSelection) {
                    window.editor.setSelection(currentSelection);
                }
                if (currentScrollTop) {
                    window.editor.setScrollTop(currentScrollTop);
                }
            }
            if (extension) {
                const model = window.editor.getModel();
                if (model) {
                    const newLang = getLanguageByExtension(extension);
                    if (model.getLanguageId() !== newLang) {
                        monaco.editor.setModelLanguage(model, newLang);
                    }
                }
            }
        } else {
            pendingCode = decoded;
            pendingExtension = extension || "";
        }
    }

    function getEditorValueForSave() {
        if (window.editor) {
            const val = window.editor.getValue();
            if (window.AndroidBridge && window.AndroidBridge.onTextChanged) {
                window.AndroidBridge.onTextChanged(val);
            }
            return val;
        }
        return "";
    }

    function editorSelectAll() {
        if (window.editor) {
            const model = window.editor.getModel();
            window.editor.setSelection(model.getFullModelRange());
            window.editor.focus();
        }
    }
    function editorCopy() {
        if (window.editor) {
            const selection = window.editor.getSelection();
            const text = window.editor.getModel().getValueInRange(selection);
            if (window.AndroidBridge && window.AndroidBridge.onCopyRequested) {
                window.AndroidBridge.onCopyRequested(text);
            }
        }
    }
    function editorPaste(base64Code) {
        if (window.editor) {
            const text = base64ToUtf8(base64Code);
            const selection = window.editor.getSelection();
            const id = { major: 1, minor: 1 };
            const op = { identifier: id, range: selection, text: text, forceMoveMarkers: true };
            window.editor.executeEdits("my-source", [op]);
            window.editor.focus();
        }
    }
    function editorUndo() {
        if (window.editor) {
            window.editor.trigger('keyboard', 'undo', null);
            window.editor.focus();
        }
    }
    function editorRedo() {
        if (window.editor) {
            window.editor.trigger('keyboard', 'redo', null);
            window.editor.focus();
        }
    }
    function editorTriggerSuggest() {
        if (window.editor) {
            window.editor.trigger('keyboard', 'editor.action.triggerSuggest', {});
            window.editor.focus();
        }
    }
</script>
</body>
</html>
